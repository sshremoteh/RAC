name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rac-x86_64-linux.tar.gz
            binary: target/x86_64-unknown-linux-gnu/release/rac
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rac-aarch64-darwin.tar.gz
            binary: target/aarch64-apple-darwin/release/rac
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: rac-x86_64-darwin.tar.gz
            binary: target/x86_64-apple-darwin/release/rac
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rac-x86_64-pc-windows-msvc.zip
            binary: target/x86_64-pc-windows-msvc/release/rac.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --bin rac

      - name: Package Linux / macOS archive
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.artifact_name }} -C $(dirname ${{ matrix.binary }}) $(basename ${{ matrix.binary }})

      - name: Package Windows archive
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
