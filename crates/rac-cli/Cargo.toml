[package]
name = "rac-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rac"
path = "src/main.rs"

[dependencies]
rac-zip = { path = "../rac-zip" }
rac-axml = { path = "../rac-axml" }
rac-signer = { path = "../rac-signer" }
rac-dex = { path = "../rac-dex" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
walkdir = "2.5"
