[package]
name = "rac-signer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rac-zip = { path = "../rac-zip" }
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
signature = "2.2"
rcgen = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
rac-axml = { path = "../rac-axml" }
